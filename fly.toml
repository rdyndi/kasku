# fly.toml app configuration file for KASKU
# Lihat dokumentasi: https://fly.io/docs/reference/configuration/

app = "kasku"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATABASE_URL = "file:/data/kasku.db"
  NODE_OPTIONS = "--max-old-space-size=200"

[mounts]
  source = "kasku_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
